name: Build RMX5080 GKI 6.6.118 (SukiSU-Ultra built-in + SUSFS)

# 目标设备: realme Neo7 SE RMX5080 / MT6899 (Dimensity 8400-Max)
#   GKI KMI: android15-6.6 (KMI_GENERATION=8), 4K 页, aarch64
#   出厂内核: 6.6.118-android15-8-ge58033dc8ea6-abogki498046332-4k
# 说明: 产出 AnyKernel3 刷机包(内核内置 KSU + SUSFS), 不含 LKM 模式。
#
# 2026 年起 AOSP kernel/manifest 已移除旧版 build/build.sh, 构建入口为 kleaf:
#   tools/bazel build --config=fast --lto=<thin|none> //common:kernel_aarch64_dist
# 若 kleaf 失败, 自动回退到纯 make 构建 (关闭 TRIM_UNUSED_KSYMS 以保留全部导出符号)。

on:
  workflow_dispatch:
    inputs:
      gki_branch:
        description: 'AOSP kernel manifest 分支 (6.6.118 = common-android15-6.6-2026-01)'
        required: true
        default: 'common-android15-6.6-2026-01'
      ksu_ref:
        description: 'SukiSU-Ultra builtin 分支的 tag/commit/branch (对应管理器 v4.2.0)'
        required: true
        default: '70fa0e092a'
      susfs_branch:
        description: 'susfs4ksu 分支'
        required: true
        default: 'gki-android15-6.6'
      susfs_commit:
        description: 'susfs4ksu commit (留空 = 分支最新)'
        required: false
        default: 'a0f9c59'
      lto:
        description: 'LTO 模式 (thin / none)'
        required: true
        default: 'thin'
      create_release:
        description: '创建 GitHub Release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      # ---------------------------------------------------------------- 环境
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev \
            python3 python-is-python3 \
            zip unzip lz4 zstd cpio rsync ccache kmod dwarves \
            device-tree-compiler git curl ca-certificates
          df -h /

      - name: 配置 ccache
        run: |
          set -euxo pipefail
          ccache --max-size=3G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: 恢复 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ inputs.gki_branch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ inputs.gki_branch }}-

      - name: 安装 repo 工具
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------ 源码同步
      - name: 同步 AOSP GKI 源码
        run: |
          set -euxo pipefail
          mkdir -p kernel
          cd kernel
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest \
            -b "${{ inputs.gki_branch }}" --repo-rev=v2.16
          repo sync -c -j"$(nproc)" --no-tags --fail-fast
          test -d common || { echo "::error::repo sync 后没有 common/ 目录"; exit 1; }
          echo "--- 顶层目录 ---"; ls -1
          echo "--- 构建入口 ---"; ls -l tools/bazel 2>/dev/null || echo "(tools/bazel 不存在)"
          df -h /

      - name: 校验内核版本与 KMI
        run: |
          set -euxo pipefail
          cd kernel
          MAJ=$(sed -n 's/^VERSION = //p' common/Makefile)
          PAT=$(sed -n 's/^PATCHLEVEL = //p' common/Makefile)
          SUB=$(sed -n 's/^SUBLEVEL = //p' common/Makefile)
          KMI=$(sed -n 's/^KMI_GENERATION=//p' common/build.config.common)
          LV=$(sed -n 's/^CONFIG_LOCALVERSION="\(.*\)"/\1/p' common/arch/arm64/configs/gki_defconfig)
          echo "内核版本 = $MAJ.$PAT.$SUB"
          echo "KMI = android15-6.6 (KMI_GENERATION=$KMI)"
          echo "LOCALVERSION = $LV"
          echo "CLANG = $(sed -n 's/^CLANG_VERSION=//p' common/build.config.constants)"
          [ "$MAJ.$PAT.$SUB" = "6.6.118" ] || { echo "::error::期望 6.6.118, 实际 $MAJ.$PAT.$SUB"; exit 1; }
          [ "$KMI" = "8" ] || { echo "::error::期望 KMI_GENERATION=8, 实际 $KMI"; exit 1; }
          [ "$LV" = "-4k" ] || { echo "::error::期望 LOCALVERSION=-4k, 实际 $LV"; exit 1; }
          echo "✅ 内核版本 / KMI / 页大小 与 RMX5080 出厂内核一致"

      # ---------------------------------------------------------- 集成 SukiSU
      - name: 集成 SukiSU-Ultra (builtin 分支, 原生含 SUSFS 胶水)
        run: |
          set -euxo pipefail
          cd kernel
          git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          cd KernelSU
          git checkout "${{ inputs.ksu_ref }}"
          echo "SukiSU commit: $(git rev-parse HEAD)"
          grep -q 'config KSU_SUSFS' kernel/Kconfig \
            || { echo "::error::该 SukiSU 分支不含 SUSFS 支持, 请使用 builtin 分支"; exit 1; }
          cd ..
          ln -sf "$(realpath --relative-to=common/drivers KernelSU/kernel)" common/drivers/kernelsu
          grep -q kernelsu common/drivers/Makefile \
            || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> common/drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' common/drivers/Kconfig \
            || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig

          # ---- 修补上游缺陷 (builtin 分支是"部分同步"的, 已在本机逐项验证) ----
          # 实测: 补完这 3 处后 drivers/kernelsu/ 编译 rc=0,
          # 且与 SUSFS v2.3.0 核心补丁的符号需求求差集为 0 (不会链接失败)。

          # (1) builtin 漏提交 kernel/arch.h, 而 kernel_includes.h:76 有
          #     #include "arch.h" -> ksu.o 编译失败。
          #     main 的 kernel/include/arch.h 是纯宏、自包含, 直接搬。
          ARCH_H=$(find KernelSU/kernel -name 'arch.h' 2>/dev/null | head -1)
          if [ -z "$ARCH_H" ]; then
            curl -fsSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/include/arch.h" \
              -o KernelSU/kernel/arch.h
            cp KernelSU/kernel/arch.h KernelSU/kernel/include/arch.h
            grep -q '__PT_PARM1_REG' KernelSU/kernel/arch.h \
              || { echo "::error::arch.h 内容不正确"; exit 1; }
            echo "✅ [1/3] 已补入 arch.h"
          else
            echo "[1/3] arch.h 已存在"
          fi

          # (2) kernel/include/uapi/supercall.h 漏了 EVENT_SERVICES,
          #     但 supercall/dispatch.c:98 在用 -> 未声明标识符。
          #     注意: 仓库根的 uapi/ 是给 userspace 的, kernel 用 include/uapi/。
          if ! grep -q 'EVENT_SERVICES' KernelSU/kernel/include/uapi/supercall.h; then
            sed -i 's/^DECLARE(__u32, EVENT_MODULE_MOUNTED, 3);$/DECLARE(__u32, EVENT_MODULE_MOUNTED, 3);\nDECLARE(__u32, EVENT_SERVICES, 4);/' \
              KernelSU/kernel/include/uapi/supercall.h
            grep -q 'EVENT_SERVICES, 4' KernelSU/kernel/include/uapi/supercall.h \
              || { echo "::error::EVENT_SERVICES 写入失败"; exit 1; }
            echo "✅ [2/3] 已补 EVENT_SERVICES"
          else
            echo "[2/3] EVENT_SERVICES 已存在"
          fi

          # (3) selinux/rules.c 的 >=5.10 分支内重复声明 pol/old_pol, 与外层冲突。
          #     下一行立即赋值, 故删掉内层的类型声明即可。
          if grep -q '^    struct selinux_policy \*pol, \*old_pol = selinux_state.policy;$' KernelSU/kernel/selinux/rules.c; then
            sed -i '/^    struct selinux_policy \*pol, \*old_pol = selinux_state.policy;$/d' \
              KernelSU/kernel/selinux/rules.c
            echo "✅ [3/3] 已删除重复声明"
          else
            echo "[3/3] rules.c 无重复声明"
          fi
          echo "✅ SukiSU-Ultra 已接入 common/drivers/kernelsu"

      # ------------------------------------------------------------- 集成 SUSFS
      - name: 应用 SUSFS 核心补丁
        run: |
          set -euxo pipefail
          git clone -b "${{ inputs.susfs_branch }}" https://github.com/ShirkNeko/susfs4ksu.git susfs4ksu
          if [ -n "${{ inputs.susfs_commit }}" ]; then
            cd susfs4ksu && git checkout "${{ inputs.susfs_commit }}" && cd ..
          fi
          echo "SUSFS commit: $(git -C susfs4ksu rev-parse HEAD)"
          grep -m1 SUSFS_VERSION susfs4ksu/kernel_patches/include/linux/susfs.h || true

          PATCH=susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch
          test -f "$PATCH" || { echo "::error::找不到 SUSFS 补丁 $PATCH"; exit 1; }

          cp susfs4ksu/kernel_patches/fs/susfs.c                 kernel/common/fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h      kernel/common/include/linux/
          cp susfs4ksu/kernel_patches/include/linux/susfs_def.h  kernel/common/include/linux/
          cp "$PATCH" kernel/common/

          cd kernel/common
          patch -p1 --fuzz=3 --no-backup-if-mismatch < "$(basename "$PATCH")"
          test -f fs/susfs.c || { echo "::error::fs/susfs.c 缺失"; exit 1; }
          echo "✅ SUSFS 核心补丁已应用"

      # --------------------------------------------------------------- 配置
      - name: 写入内核配置 (KSU + SUSFS)
        run: |
          set -euxo pipefail
          cat >> kernel/common/arch/arm64/configs/gki_defconfig <<'EOF'

          # ==== KernelSU (built-in) ====
          CONFIG_KSU=y
          CONFIG_KPM=y
          CONFIG_KSU_SUSFS_SUS_SU=n

          # ==== tmpfs ====
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y

          # ==== SUSFS v2.3.0 ====
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_PATH=n
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y

          # ==== 网络 / 拥塞控制 ====
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          EOF
          echo "✅ 已追加 KSU/SUSFS 配置"

      - name: 调整 AOSP 构建配置
        run: |
          set -euxo pipefail
          cd kernel
          sed -i 's/check_defconfig//' common/build.config.gki
          sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' common/build.config.gki.aarch64
          sed -i '/MODULES_ORDER=/d; /KMI_SYMBOL_LIST_STRICT_MODE/d' common/build.config.gki.aarch64
          echo "--- build.config.gki ---"; cat common/build.config.gki

      # --------------------------------------------------------------- 编译
      - name: 编译内核 (纯 make 主路径, 失败回退 kleaf)
        run: |
          set -euxo pipefail
          cd kernel
          export LTO="${{ inputs.lto }}"

          # ---- 主路径: 纯 make ----
          # 用 manifest 自带的 AOSP clang-r510928 (与出厂内核编译工具完全一致)
          # 关闭 TRIM_UNUSED_KSYMS: 保留全部导出符号 = KMI 的超集, 符号 CRC 不变,
          # 因此原厂 vendor_dlkm 模块照常加载 (也省去 abi_symbollist.raw 依赖)
          set +e
          (
            cd common
            export PATH="$PWD/../prebuilts/clang/host/linux-x86/clang-r510928/bin:$PWD/../prebuilts/build-tools/linux-x86/bin:$PWD/../prebuilts/kernel-build-tools/linux-x86/bin:$PATH"
            clang --version | head -2
            make O=out ARCH=arm64 LLVM=1 gki_defconfig
            ./scripts/config --file out/.config -d TRIM_UNUSED_KSYMS -d UNUSED_KSYMS_WHITELIST
            make O=out ARCH=arm64 LLVM=1 olddefconfig
            echo "--- 关键配置核对 ---"
            grep -E 'CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_KSU_SUSFS_SUS_MOUNT=|CONFIG_TRIM_UNUSED_KSYMS|CONFIG_LTO_NONE|CONFIG_ARM64_4K_PAGES' out/.config || true
            make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 Image.lz4
          )
          rc=$?
          set -e

          if [ $rc -eq 0 ]; then
            echo "✅ 纯 make 构建成功"
          else
            echo "::warning::纯 make 构建失败 (rc=$rc), 回退到 kleaf/Bazel"
            # 清掉 make 生成的 out/ (里面有 out/source -> common 的自引用软链, 会让 bazel 报无限软链)
            rm -rf common/out
            tools/bazel build --config=fast --verbose_failures --lto="$LTO" \
              //common:kernel_aarch64_dist
          fi
          df -h /

      - name: 收集编译产物
        run: |
          set -euxo pipefail
          cd kernel

          # 纯 make 的输出在 common/out/arch/arm64/boot/
          # kleaf 的输出在 bazel-bin/common/kernel_aarch64/dist/
          # 注意: 内核构建会在 common/out 下生成自引用软链 source -> common,
          #       所以绝不能用 `find -L .`(会报 filesystem loop 并以 1 退出,
          #       配合 pipefail+set -e 会直接杀掉脚本)。优先用显式路径。
          IMG=""
          for p in \
            common/out/arch/arm64/boot/Image.lz4 \
            bazel-bin/common/kernel_aarch64/dist/Image.lz4 \
            common/out/arch/arm64/boot/Image.gz \
            bazel-bin/common/kernel_aarch64/dist/Image.gz \
            common/out/arch/arm64/boot/Image \
            bazel-bin/common/kernel_aarch64/dist/Image ; do
            if [ -f "$p" ]; then IMG="$p"; break; fi
          done

          # 兜底: 受保护的 find (不使用 -L, 且不允许失败传播)
          if [ -z "$IMG" ]; then
            IMG=$(find common/out bazel-bin -maxdepth 8 -type f \
                    \( -name 'Image.lz4' -o -name 'Image.gz' -o -name 'Image' \) \
                    -print -quit 2>/dev/null || true)
          fi

          [ -n "$IMG" ] || { echo "::error::没找到编译出的内核镜像"; exit 1; }
          echo "IMG=$IMG"
          ls -l "$IMG"
          file "$IMG" || true
          cp "$IMG" "$GITHUB_WORKSPACE/Image.lz4"
          ls -l "$GITHUB_WORKSPACE/Image.lz4"
          echo "=== 产物内嵌版本串 ==="
          strings "$GITHUB_WORKSPACE/Image.lz4" 2>/dev/null | grep -m3 -E '^6\.6\.[0-9]+' || true

      # ------------------------------------------------------------ AnyKernel3
      - name: 打包 AnyKernel3
        run: |
          set -euxo pipefail
          git clone --depth=1 -b gki-2.0 https://github.com/WildPlusKernel/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git
          cp ak3/anykernel.sh AnyKernel3/anykernel.sh
          chmod +x AnyKernel3/anykernel.sh
          cp Image.lz4 AnyKernel3/

          ZIP="RMX5080-GKI-6.6.118-SukiSU-SUSFS-AnyKernel3.zip"
          ( cd AnyKernel3 && zip -r9 "$GITHUB_WORKSPACE/$ZIP" . -x '*.git*' )
          ls -l "$ZIP"
          sha256sum "$ZIP" | tee SHA256SUMS.txt
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"

      - name: 上传产物 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: RMX5080-6.6.118-SukiSU-SUSFS
          path: |
            ${{ env.ZIP_NAME }}
            SHA256SUMS.txt
          if-no-files-found: error

      - name: 创建 Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-6.6.118
          name: "RMX5080 GKI 6.6.118 + SukiSU-Ultra + SUSFS (build ${{ github.run_number }})"
          body: |
            目标设备: realme Neo7 SE (RMX5080 / MT6899)
            内核: Linux **6.6.118**-android15-6.6 (KMI_GENERATION=8, 4K 页)
            Root: SukiSU-Ultra `${{ inputs.ksu_ref }}` (built-in, 不依赖 LKM)
            SUSFS: `${{ inputs.susfs_branch }}` 核心补丁 v2.3.0
            LTO: `${{ inputs.lto }}`

            刷入方式: 用 Kernel Flasher / HorizonKernelFlasher 选择本 zip 刷入 (写入 boot 分区)。
          files: |
            ${{ env.ZIP_NAME }}
            SHA256SUMS.txt
